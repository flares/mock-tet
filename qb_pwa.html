<script>
/* ── Per-paper measured line heights (px) ───────────────────────────────── */
// Average pixel height of a single text line in question images, measured per paper.
// Used to compute a uniform scale so all papers render text at the same CSS size.
const PAPER_LINE_HEIGHTS = {};
const PAPER_LINE_HEIGHT_DEFAULT = 47;
const LS_FONT_SIZE_KEY = 'qb_target_line_height_px';

/* ── Constants ──────────────────────────────────────────────────────────── */
const APP_VERSION    = '0.4.5';
const CACHE_BUST     = '1';   // increment on special pushes to wipe stale localStorage
const UNDERSTOOD_KEY = 'tet_understood_questions';
const REVISION_KEY   = 'tet_revision_questions';
const AI_CACHE_PFX   = 'ai_exp_persist:';
const QB_MANIFEST_URL = 'exams/qb_manifest.json';
const SELECTED_BANK_KEY = 'qb_selected_bank';
const DEFAULT_BANK   = 'tgtet_maths_science_telugu';   // legacy stream — preselected
const posKey     = bank => `qb_pos_v1:${bank}`;
const filtersKey = bank => `qb_filters_v1:${bank}`;
// Per-stream index cache key (v2: was a single 'qb_index_cache_v1' before multi-TET)
const qbCacheKey = bank => `qb_index_cache_v2:${bank}`;
const streamIndexUrl = bank => `exams/qb_index_${bank}.json`;

// R2 explanation state for the current question (null when no R2 explanation loaded)
let _r2CurrentExp = null;

const SHOW_ANSWER_REVEAL = true;

/* ── State ──────────────────────────────────────────────────────────────── */
let qbManifest         = null;   // qb_manifest.json — TET → Paper → Stream tree
let selectedBank       = null;   // active tet_bank
let selectedStream     = null;   // active stream config object from the manifest
let streamSections     = [];     // [{id, name}] sections for the active stream
let qbankCache         = null;
let qbankFiltered      = [];
let qbankSubjectFilter = 'all';
let qbankPaperFilter   = 'all';       // an examId, or 'all' — mutually exclusive with subject
let qbankStatusFilter  = 'to-read';   // default: unread questions
let qbankIndex         = 0;
let _restorePos        = null;   // questionImage to seek after next navReset

// Scope predicate shared by the filter pipeline and the header counts.
// Paper filter wins when active (mutually exclusive with subject).
function inActiveScope(q) {
  if (qbankPaperFilter !== 'all')   return q.examId === qbankPaperFilter;
  if (qbankSubjectFilter !== 'all') return (q.sectionId || '').toLowerCase() === qbankSubjectFilter;
  return true;
}
// Ordered, de-duplicated list of papers in the active stream.
function papersForStream() {
  const out = [], seen = new Set();
  for (const q of (qbankCache || [])) {
    if (q.examId && !seen.has(q.examId)) { seen.add(q.examId); out.push({ examId: q.examId, examTitle: q.examTitle }); }
  }
  return out;
}

// Display label for a subject/section id within the active stream
function subjectDisplay(id) {
  if (!id || id === 'all') return 'All Subjects';
  const s = streamSections.find(x => x.id === id);
  return s ? s.name : id;
}

// Navigation history — tracks visited qbankFiltered indices so back/forward works
// across random jumps. Reset on filter changes.
let navHistory = [0];
let navPos     = 0;

function navPush(idx) {
  navHistory.splice(navPos + 1);   // discard any forward history when branching
  navHistory.push(idx);
  navPos     = navHistory.length - 1;
  qbankIndex = idx;
  try {
    const item = qbankFiltered[idx];
    if (selectedBank && item) localStorage.setItem(posKey(selectedBank), item.questionImage);
  } catch {}
}

function navReset() {
  qbankIndex = 0;
  navHistory = qbankFiltered.length > 0 ? [0] : [];
  navPos     = qbankFiltered.length > 0 ? 0 : -1;
}

// Per-question reveal state for the click-to-reveal option behaviour.
// Map<questionImage, { picked: 1-based index }>
const optionChoices    = new Map();

/* ── Storage ────────────────────────────────────────────────────────────── */
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function getUnderstoodSet() {
  try { return new Set(JSON.parse(localStorage.getItem(UNDERSTOOD_KEY))||[]); } catch { return new Set(); }
}
function saveUnderstoodSet(s) { localStorage.setItem(UNDERSTOOD_KEY, JSON.stringify([...s])); }
function getRevisionList() {
  try { return JSON.parse(localStorage.getItem(REVISION_KEY))||[]; } catch { return []; }
}
function getRevisionSet() {
  return new Set(getRevisionList().map(r => r.q?.questionImage).filter(Boolean));
}
function saveRevisionList(list) { localStorage.setItem(REVISION_KEY, JSON.stringify(list)); }
function aiCacheKey(q) { const p = q.split('/'); return AI_CACHE_PFX + p[p.length-2]; }
function getAiCache(q) { try { return localStorage.getItem(aiCacheKey(q))||null; } catch { return null; } }

/* ── Revision / Understood helpers ─────────────────────────────────────── */
function toggleRevision(qimg) {
  if (!qbankCache) return;
  const item = qbankCache.find(x => x.questionImage === qimg);
  if (!item) return;
  const list = getRevisionList();
  const idx = list.findIndex(r => r.q?.questionImage === qimg);
  if (idx >= 0) {
    list.splice(idx, 1);
  } else {
    list.push({ examId: item.examId, examTitle: item.examTitle, q: item });
    // Mutual exclusivity: remove from understood when added to review
    const und = getUnderstoodSet(); und.delete(qimg); saveUnderstoodSet(und);
  }
  saveRevisionList(list);
}
function toggleUnderstood(qimg) {
  const s = getUnderstoodSet();
  if (s.has(qimg)) {
    s.delete(qimg);
  } else {
    s.add(qimg);
    // Mutual exclusivity: remove from review when added to understood
    saveRevisionList(getRevisionList().filter(r => r.q?.questionImage !== qimg));
  }
  saveUnderstoodSet(s);
}

function cleanConflictingStates() {
  const understood = getUnderstoodSet();
  const list = getRevisionList();
  const cleaned = list.filter(r => !understood.has(r.q?.questionImage));
  if (cleaned.length !== list.length) saveRevisionList(cleaned);
}

/* ── Manifest + per-stream index loading ────────────────────────────────── */
const MANIFEST_CACHE_KEY = 'qb_manifest_cache_v1';

async function loadManifest() {
  if (qbManifest) return qbManifest;
  // Warm from localStorage, revalidate in background
  try {
    const raw = localStorage.getItem(MANIFEST_CACHE_KEY);
    if (raw) { const c = JSON.parse(raw); if (c?.tets?.length) { qbManifest = c; _revalidateManifest(); return qbManifest; } }
  } catch {}
  return _fetchManifest();
}
async function _fetchManifest() {
  const resp = await fetch(QB_MANIFEST_URL, { cache: 'no-cache' });
  if (!resp.ok) throw new Error(`manifest ${resp.status}`);
  const data = await resp.json();
  try { localStorage.setItem(MANIFEST_CACHE_KEY, JSON.stringify(data)); } catch {}
  qbManifest = data;
  return data;
}
async function _revalidateManifest() { try { await _fetchManifest(); } catch {} }

// Every stream config across the manifest, flat
function allStreams() {
  const out = [];
  for (const t of (qbManifest?.tets || []))
    for (const p of (t.papers || []))
      for (const s of (p.streams || []))
        out.push({ ...s, tet_type: t.tet_type, tet_label: t.label, paper: p.paper, paper_label: p.label });
  return out;
}
function findStream(bank) { return allStreams().find(s => s.tet_bank === bank) || null; }

/* Load the active stream's index into qbankCache (warm cache + background revalidate). */
async function loadQuestionBank() {
  if (qbankCache && qbankCache._bank === selectedBank) return qbankCache;
  const bank = selectedBank;
  try {
    const raw = localStorage.getItem(qbCacheKey(bank));
    if (raw) { const c = JSON.parse(raw); if (c?.data?.length) { qbankCache = _tag(c.data, bank); _revalidateStream(bank, c.etag); return qbankCache; } }
  } catch {}
  return _fetchStreamIndex(bank);
}
function _tag(data, bank) { try { Object.defineProperty(data, '_bank', { value: bank, configurable: true }); } catch {} return data; }

async function _fetchStreamIndex(bank, etag) {
  const headers = {};
  if (etag) headers['If-None-Match'] = etag;
  const resp = await fetch(streamIndexUrl(bank), { headers });
  if (resp.status === 304) return qbankCache;
  if (!resp.ok) throw new Error(`index ${resp.status}`);
  const data = await resp.json();
  const newEtag = resp.headers.get('etag') || '';
  try { localStorage.setItem(qbCacheKey(bank), JSON.stringify({ v: 2, etag: newEtag, data })); } catch {}
  if (selectedBank === bank) qbankCache = _tag(data, bank);
  return data;
}
async function _revalidateStream(bank, etag) { try { await _fetchStreamIndex(bank, etag); } catch {} }

/* ── Filter ─────────────────────────────────────────────────────────────── */
function buildFiltered(all) {
  const understood = getUnderstoodSet();
  const revSet     = getRevisionSet();

  const statusMatch = q => {
    switch (qbankStatusFilter) {
      case 'to-read':    return !understood.has(q.questionImage);
      case 'in-review':  return revSet.has(q.questionImage);
      case 'understood': return understood.has(q.questionImage);
      default:           return true;
    }
  };

  return all.filter(q => inActiveScope(q) && statusMatch(q));
}

/* ── Empty state ─────────────────────────────────────────────────────────── */
const EMPTY_DEFS = {
  'to-read': {
    icon: '🎉',
    text: 'All questions here have been reviewed!<br>Try a different subject or filter.',
  },
  'in-review': {
    icon: '🔖',
    text: 'No questions in review yet.<br>Tap the <strong>🔖 bookmark icon</strong> on the right while browsing to add questions here.',
  },
  'understood': {
    icon: '✓',
    text: 'No questions marked as understood yet.<br>Tap the <strong>✓ checkmark icon</strong> on the right to mark a question as understood.',
  },
};

function showEmptyState() {
  const def = EMPTY_DEFS[qbankStatusFilter] || { icon: '🔍', text: 'No questions match these filters.' };
  document.getElementById('pwa-empty-icon').textContent = def.icon;
  document.getElementById('pwa-empty-text').innerHTML   = def.text;
  document.getElementById('pwa-empty-state').classList.add('visible');

  setFocusMode(false);   // never strand the user in focus mode on an empty list
  document.getElementById('pwa-qcard').hidden  = true;
  document.getElementById('pwa-prev').disabled = true;
  document.getElementById('pwa-next').disabled = true;
  document.getElementById('pwa-fab').hidden     = true;
}

/* ── Image scaling ──────────────────────────────────────────────────────── */
let targetLineHeightPx = Math.max(40, Math.min(60, parseInt(localStorage.getItem(LS_FONT_SIZE_KEY) || '48', 10)));

function paperIdFromPath(imgPath) {
  // "question_bank/CDP/2024-May-20-Shift1_Q001_.../question.png" → "2024-May-20-Shift1"
  const folder = (imgPath || '').split('/')[2] || '';
  return folder.split('_Q')[0];
}

function getScale(paperId) {
  const lineH = PAPER_LINE_HEIGHTS[paperId] || PAPER_LINE_HEIGHT_DEFAULT;
  return targetLineHeightPx / lineH;
}

function applyScaleToCurrentQuestion() {
  const item = qbankFiltered[qbankIndex];
  if (!item) return;
  const scale  = getScale(paperIdFromPath(item.questionImage));
  const sprite = item.sprite || {};

  const qCanvas = document.getElementById('pwa-qimg');
  if (qCanvas && sprite.question) {
    qCanvas.style.width  = Math.round(sprite.question.w * scale) + 'px';
    qCanvas.style.height = Math.round(sprite.question.h * scale) + 'px';
  }
  document.querySelectorAll('#pwa-opts .pwa-opt').forEach(div => {
    const k      = Number(div.dataset.opt);
    const coords = sprite[`option${k}`];
    const cnv    = div.querySelector('canvas');
    if (coords && cnv) {
      cnv.style.width  = Math.round(coords.w * scale) + 'px';
      cnv.style.height = Math.round(coords.h * scale) + 'px';
    }
  });
}

function hideEmptyState() {
  document.getElementById('pwa-empty-state').classList.remove('visible');
  document.getElementById('pwa-qcard').hidden = false;
  document.getElementById('pwa-fab').hidden    = false;
}

/* ── Filter pipeline ──────────────────────────────────────────────────────
   applyFilters() rebuilds qbankFiltered + resets index, then renders.
   Called ONLY on filter changes (subject, status) and initial load.
   Navigation buttons call renderCurrent() so the filtered set stays frozen
   while the user works through it — otherwise marking Q1 understood would
   silently drop it from the list and Next would skip Q2 (jumps to Q3).
   ───────────────────────────────────────────────────────────────────────── */
async function applyFilters() {
  let all;
  try { all = await loadQuestionBank(); }
  catch (err) {
    hideEmptyState();
    document.getElementById('pwa-explanation').innerHTML =
      `<p class="pwa-msg">Could not load question bank: ${esc(err.message)}</p>`;
    return;
  }
  qbankFiltered = buildFiltered(all);
  navReset();
  if (_restorePos) {
    const idx = qbankFiltered.findIndex(q => q.questionImage === _restorePos);
    if (idx >= 0) { qbankIndex = idx; navHistory = [idx]; navPos = 0; }
    _restorePos = null;
  }
  renderCurrent();
}

/* ── Sprite rendering helpers ─────────────────────────────────────────── */
function _drawCrop(cnv, spriteImg, coords, scale) {
  const { y, h, w } = coords;
  cnv.width  = w;
  cnv.height = h;
  cnv.style.width  = Math.round(w * scale) + 'px';
  cnv.style.height = Math.round(h * scale) + 'px';
  cnv.getContext('2d').drawImage(spriteImg, 0, y, w, h, 0, 0, w, h);
}

function renderCurrent() {
  updateHeaderProgress();

  if (!qbankFiltered.length) { showEmptyState(); return; }

  hideEmptyState();
  updateFabVisibility();
  updateFabState();

  if (qbankIndex >= qbankFiltered.length) qbankIndex = qbankFiltered.length - 1;
  if (qbankIndex < 0) qbankIndex = 0;

  const item      = qbankFiltered[qbankIndex];
  const qimg      = item.questionImage;
  const sprite    = item.sprite || {};
  const spriteUrl = item.spriteUrl;
  const scale     = getScale(paperIdFromPath(qimg));
  const qNum      = item.globalIndex != null ? item.globalIndex + 1 : '?';
  const subj      = (item.sectionId || '').toUpperCase();

  document.getElementById('pwa-qnum').textContent =
    `${item.examTitle || item.examId || ''} · ${subj} · Q${qNum}`;

  const qCanvas  = document.getElementById('pwa-qimg');
  const optsEl   = document.getElementById('pwa-opts');
  const optsWrap = document.getElementById('pwa-opts-wrap');

  // Build options HTML (canvas placeholders filled once sprite loads)
  const optKeys = [1, 2, 3, 4].filter(k => sprite[`option${k}`]);
  if (!item.optionsInQuestion && spriteUrl && optKeys.length) {
    optsWrap.style.display = '';
    const prior = optionChoices.get(qimg);
    optsEl.className = 'pwa-opts' + (prior ? ' pwa-opts--revealed' : ' pwa-opts--inert');
    optsEl.innerHTML = optKeys.map(k => {
      let cls = 'pwa-opt';
      if (prior) {
        if (k === Number(item.correctAnswer)) cls += ' pwa-opt--correct';
        else if (k === prior.picked)          cls += ' pwa-opt--wrong';
      }
      // Pre-size the canvas to its known piece dims + shimmer while the sprite loads.
      const c = sprite[`option${k}`];
      const w = Math.round(c.w * scale), h = Math.round(c.h * scale);
      return `<div class="${cls}" data-opt="${k}"><span class="pwa-opt-num">${k}</span><canvas class="pwa-opt-canvas pwa-loading" style="width:${w}px;height:${h}px"></canvas></div>`;
    }).join('');
  } else {
    optsEl.innerHTML = ''; optsWrap.style.display = 'none';
  }

  // Load sprite and draw crops into canvases
  if (spriteUrl && sprite.question) {
    // Skeleton: clear the stale bitmap (so the shimmer CSS bg shows) and pre-size
    // the question canvas to its known dims, so there's no reflow when it paints.
    qCanvas.width  = sprite.question.w;
    qCanvas.height = sprite.question.h;
    qCanvas.style.width  = Math.round(sprite.question.w * scale) + 'px';
    qCanvas.style.height = Math.round(sprite.question.h * scale) + 'px';
    qCanvas.classList.add('pwa-loading');

    const guardImg = qimg;
    const clearSkeletons = () => {
      qCanvas.classList.remove('pwa-loading');
      optsEl.querySelectorAll('canvas.pwa-loading').forEach(c => c.classList.remove('pwa-loading'));
    };
    const spriteImg = new Image();
    spriteImg.crossOrigin = 'anonymous';
    spriteImg.onload = () => {
      const stillItem = qbankFiltered[qbankIndex];
      if (!stillItem || stillItem.questionImage !== guardImg) return;
      _drawCrop(qCanvas, spriteImg, sprite.question, scale);
      qCanvas.classList.remove('pwa-loading');
      if (!item.optionsInQuestion) {
        optKeys.forEach(k => {
          const div = optsEl.querySelector(`[data-opt="${k}"]`);
          const cnv = div?.querySelector('canvas');
          if (cnv) { _drawCrop(cnv, spriteImg, sprite[`option${k}`], scale); cnv.classList.remove('pwa-loading'); }
        });
      }
    };
    // On failure, stop the shimmer rather than spin forever.
    spriteImg.onerror = () => {
      const stillItem = qbankFiltered[qbankIndex];
      if (stillItem && stillItem.questionImage === guardImg) clearSkeletons();
    };
    spriteImg.src = spriteUrl;
  } else {
    // Clear canvas if no sprite available
    qCanvas.classList.remove('pwa-loading');
    qCanvas.width = 1; qCanvas.height = 1;
    qCanvas.style.width = ''; qCanvas.style.height = '';
  }

  document.getElementById('pwa-prev').disabled = qbankIndex <= 0;
  document.getElementById('pwa-next').disabled = qbankIndex >= qbankFiltered.length - 1;

  const aiBtn = document.getElementById('pwa-ai-btn');
  if (aiBtn) {
    aiBtn.style.display = ''; aiBtn.disabled = false;
    aiBtn.innerHTML = getAiCache(qimg) ? '&#10024; Regenerate' : '&#10024; Explain with AI';
  }

  document.getElementById('pwa-qcard').scrollTo({ top: 0, behavior: 'auto' });
  _prefetch(qbankFiltered[qbankIndex + 1]);
  _prefetch(qbankFiltered[qbankIndex - 1]);

  loadExplanation(qimg);
}

// Reveals the correct answer on first option click. Idempotent if already revealed.
function revealOption(pickedIdx) {
  const item = qbankFiltered[qbankIndex];
  if (!item) return;
  const qimg = item.questionImage;
  if (optionChoices.has(qimg)) return;          // already revealed
  optionChoices.set(qimg, { picked: pickedIdx });

  const optsEl = document.getElementById('pwa-opts');
  const correct = Number(item.correctAnswer);
  optsEl.classList.add('pwa-opts--revealed');
  optsEl.querySelectorAll('.pwa-opt').forEach(el => {
    const k = Number(el.dataset.opt);
    if (k === correct)         el.classList.add('pwa-opt--correct');
    else if (k === pickedIdx)  el.classList.add('pwa-opt--wrong');
  });
}

function _prefetch(item) { if (item?.spriteUrl) new Image().src = item.spriteUrl; }

/* ── Navigation, focus mode & swipe ─────────────────────────────────────── */
// History-aware prev/next. Return true when the position actually moved.
function navPrev() {
  if (navPos > 0)        { navPos--; qbankIndex = navHistory[navPos]; renderCurrent(); return true; }
  if (qbankIndex > 0)    { navPush(qbankIndex - 1); renderCurrent(); return true; }
  return false;
}
function navNext() {
  if (navPos < navHistory.length - 1) { navPos++; qbankIndex = navHistory[navPos]; renderCurrent(); return true; }
  if (qbankIndex < qbankFiltered.length - 1) { navPush(qbankIndex + 1); renderCurrent(); return true; }
  return false;
}

// Slide the card out in the gesture direction, swap content, slide the new one in.
let _sliding = false;
function navAnimated(dir) {            // dir: 'next' | 'prev'
  const card = document.getElementById('pwa-qcard');
  const go   = dir === 'next' ? navNext : navPrev;
  if (_sliding) return;
  if (!card || card.hidden) { go(); return; }
  const out  = dir === 'next' ? -1 : 1;                 // 'next' exits to the left
  const dist = Math.min(window.innerWidth * 0.45, 200);
  _sliding = true;
  card.style.transition = 'transform 0.17s ease-in, opacity 0.17s ease-in';
  card.style.transform  = `translateX(${out * dist}px)`;
  card.style.opacity    = '0';
  setTimeout(() => {
    const moved = go();                                 // renders next/prev (no-op at the ends)
    card.style.transition = 'none';
    card.style.transform  = `translateX(${(moved ? -out : out) * (moved ? 48 : 40)}px)`;
    void card.offsetWidth;                              // force reflow before the entry transition
    card.style.transition = 'transform 0.24s cubic-bezier(0.2,0.7,0.2,1), opacity 0.24s';
    card.style.transform  = 'translateX(0)';
    card.style.opacity    = '1';
    setTimeout(() => { card.style.transition = ''; card.style.transform = ''; _sliding = false; }, 260);
  }, 170);
}

// Focus mode — hide all chrome, keep the question card + a single exit FAB.
let _focusHintTid = null;
function setFocusMode(on) {
  on = !!on;
  const app = document.getElementById('pwa-app');
  if (!app) return;
  const was = app.classList.contains('pwa-focus');
  app.classList.toggle('pwa-focus', on);
  const btn = document.getElementById('pwa-fab-focus');
  if (btn) {
    btn.classList.toggle('is-exit', on);
    btn.setAttribute('aria-label', on ? 'Exit focus mode' : 'Focus mode');
    btn.setAttribute('aria-pressed', String(on));
  }
  if (_focusHintTid) { clearTimeout(_focusHintTid); _focusHintTid = null; }
  if (on === was) return;                       // no real state change → no toast
  if (on) {
    document.getElementById('pwa-qcard')?.scrollTo({ top: 0 });
    showToast('Focus mode on');
    _focusHintTid = setTimeout(() => {          // a beat later: how to navigate now that buttons are gone
      if (isFocusMode()) showToast('Swipe left/right to change questions');
      _focusHintTid = null;
    }, 1600);
  } else {
    showToast('Focus mode off');
  }
}
function isFocusMode() { return document.getElementById('pwa-app').classList.contains('pwa-focus'); }

// Horizontal swipe → prev/next. Vertical scroll and wide-image panning are preserved.
function attachSwipe(el) {
  let x0 = 0, y0 = 0, t0 = 0, imgWrap = null;
  el.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) { t0 = 0; return; }
    const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; t0 = Date.now();
    const w = e.target.closest('.pwa-qimg-wrap');
    imgWrap = (w && w.scrollWidth > w.clientWidth + 2) ? w : null;   // a pannable wide image
  }, { passive: true });
  el.addEventListener('touchend', e => {
    if (!t0) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0, dt = Date.now() - t0;
    t0 = 0;
    if (dt > 700) return;                                                 // too slow to be a flick
    if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.4) return;   // not horizontal-dominant
    if (imgWrap) {                                                        // defer to image panning
      const atStart = imgWrap.scrollLeft <= 0;
      const atEnd   = imgWrap.scrollLeft + imgWrap.clientWidth >= imgWrap.scrollWidth - 2;
      if (dx < 0 && !atEnd)   return;
      if (dx > 0 && !atStart) return;
    }
    navAnimated(dx < 0 ? 'next' : 'prev');
  }, { passive: true });
}

/* ── R2 rating bar ──────────────────────────────────────────────────────── */
function showRatingBar(exp, questionImage) {
  _r2CurrentExp = { exp, questionImage };
  const btn   = document.getElementById('pwa-fab-like');
  const badge = btn.querySelector('.pwa-fab-badge');
  const vote  = window.R2Explanations?.getUserVote(questionImage, exp.id) || null;
  btn.classList.toggle('marked', vote === 'liked');
  const count = exp.likes || 0;
  badge.textContent = count;
  badge.hidden = count === 0;
  btn.classList.remove('pwa-fab-hidden');
}

function hideRatingBar() {
  _r2CurrentExp = null;
  const btn = document.getElementById('pwa-fab-like');
  btn.classList.add('pwa-fab-hidden');
  btn.classList.remove('marked');
}

async function handleRate() {
  if (!_r2CurrentExp || !window.R2Explanations?.isConfigured()) return;
  const { exp, questionImage } = _r2CurrentExp;
  const currentVote = window.R2Explanations.getUserVote(questionImage, exp.id);
  const r2Action = currentVote === 'liked' ? 'unlike' : 'like';
  const newVote  = currentVote === 'liked' ? null : 'liked';
  const updated  = await window.R2Explanations.rate(questionImage, exp.id, r2Action);
  if (updated) {
    window.R2Explanations.setUserVote(questionImage, exp.id, newVote);
    showRatingBar({ ...exp, ...updated }, questionImage);
  }
}

async function loadExplanation(questionImage) {
  const expEl = document.getElementById('pwa-explanation');
  hideRatingBar();

  // 1. localStorage (instant)
  const aiCached = getAiCache(questionImage);
  if (aiCached) {
    expEl.innerHTML = aiCached;
    // Fetch R2 state in background to populate rating bar
    if (window.R2Explanations?.isConfigured()) {
      window.R2Explanations.fetch(questionImage).then(doc => {
        const best = window.R2Explanations.bestExplanation(doc?.explanations);
        if (best) showRatingBar(best, questionImage);
      });
    }
    return;
  }

  expEl.innerHTML = '<span class="pwa-msg">Loading explanation…</span>';

  // 2. R2 (100–150ms, best-rated explanation)
  if (window.R2Explanations?.isConfigured()) {
    try {
      const doc  = await window.R2Explanations.fetch(questionImage);
      const best = window.R2Explanations.bestExplanation(doc?.explanations);
      if (best) {
        ExplanationModal.setAiCache(questionImage, best.html);
        expEl.innerHTML = best.html;
        showRatingBar(best, questionImage);
        document.getElementById('pwa-ai-btn').innerHTML = '&#10024; Regenerate';
        return;
      }
    } catch {}
  }

  expEl.innerHTML = noExplanationMsg();
}
function noExplanationMsg() {
  return '<em style="color:#888;font-size:13px">No explanation yet. Tap ✨ Explain with AI to generate one.</em>';
}

/* ── Header progress ────────────────────────────────────────────────────── */
function updateHeaderProgress() {
  const understood = getUnderstoodSet();
  const revSet     = getRevisionSet();

  // Scope to the active subject OR paper filter (mutually exclusive)
  const all = qbankCache || [];
  const scoped = all.filter(inActiveScope);

  const scopedTotal = scoped.length;
  const scopedDone  = scoped.filter(q => understood.has(q.questionImage) || revSet.has(q.questionImage)).length;
  document.getElementById('pwa-progress-count').innerHTML =
    `${scopedDone}<span class="pwa-progress-total"> / ${scopedTotal}</span>`;

  // Sub-line hidden (counts shown on chips instead)
  document.getElementById('pwa-progress-sub').textContent = '';

  // Chip counts — scoped to active subject
  const revEl = document.getElementById('chip-count-review');
  const undEl = document.getElementById('chip-count-understood');
  const scopedRev = scoped.filter(q => revSet.has(q.questionImage)).length;
  const scopedUnd = scoped.filter(q => understood.has(q.questionImage)).length;
  if (revEl) revEl.textContent = scopedRev || '';
  if (undEl) undEl.textContent = scopedUnd || '';
}

/* ── FAB visibility ─────────────────────────────────────────────────────── */
function updateFabVisibility() {
  const revFab = document.getElementById('pwa-fab-revision');
  // Revision (bookmark) FAB only shown in the To Read filter
  const showRev = qbankStatusFilter === 'to-read';
  revFab.classList.toggle('pwa-fab-hidden', !showRev);
  document.getElementById('pwa-fab-understood').classList.remove('pwa-fab-hidden');
}

function updateFabState() {
  if (!qbankFiltered.length) return;
  const item = qbankFiltered[qbankIndex];
  if (!item) return;
  const understood = getUnderstoodSet();
  const revSet     = getRevisionSet();
  document.getElementById('pwa-fab-revision').classList.toggle('marked', revSet.has(item.questionImage));
  document.getElementById('pwa-fab-understood').classList.toggle('marked', understood.has(item.questionImage));
}

/* ── Toast ──────────────────────────────────────────────────────────────── */
let _toastTid = null;
function showToast(msg) {
  const t = document.getElementById('pwa-toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(_toastTid);
  _toastTid = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ── AI explain ─────────────────────────────────────────────────────────── */
async function handleAiExplain() {
  const aiBtn = document.getElementById('pwa-ai-btn');
  if (!aiBtn || aiBtn.disabled) return;
  const item = qbankFiltered[qbankIndex];
  if (!item) return;

  if (!window.AiExplainer) {
    aiBtn.disabled = true; aiBtn.textContent = '⏳ Loading AI…';
    let waited = 0;
    while (!window.AiExplainer && waited < 10000) {
      await new Promise(r => setTimeout(r, 250)); waited += 250;
    }
    aiBtn.disabled = false;
    if (!window.AiExplainer) {
      aiBtn.innerHTML = '&#10024; Explain with AI';
      document.getElementById('pwa-explanation').innerHTML =
        '<div class="pwa-ai-error"><strong>AI error:</strong> Module failed to load.</div>';
      return;
    }
  }

  const expEl      = document.getElementById('pwa-explanation');
  const expSection = document.getElementById('pwa-exp-section');
  const isRegen    = aiBtn.textContent.includes('Regenerate');
  aiBtn.disabled = true; aiBtn.textContent = '⏳ Generating…';
  expEl.innerHTML = '<div class="pwa-ai-loading"><span class="pwa-ai-spinner"></span>Generating AI explanation…</div>';
  document.getElementById('pwa-content').scrollTo({ top: expSection.offsetTop - 8, behavior: 'smooth' });

  // iOS suspends in-flight fetches when the PWA is backgrounded — track whether
  // the page lost visibility during this request so we can give a clearer error
  // and auto-retry once on resume.
  let backgroundedDuringFetch = false;
  const onVis = () => { if (document.visibilityState === 'hidden') backgroundedDuringFetch = true; };
  document.addEventListener('visibilitychange', onVis);

  try {
    const html = await window.AiExplainer.explain({
      questionImage: item.questionImage, optionImages: item.optionImages || [],
      optionsInQuestion: !!item.optionsInQuestion, correctAnswer: item.correctAnswer,
      sectionId: item.sectionId, forceRegenerate: isRegen, mobile: true,
      spriteUrl: item.spriteUrl || null,
      sprite:    item.sprite    || null,
    });
    expEl.innerHTML = html;
    aiBtn.innerHTML = '&#10024; Regenerate';
    document.getElementById('pwa-content').scrollTo({ top: expSection.offsetTop - 8, behavior: 'smooth' });
    updateHeaderProgress();
    // Save to R2 async — non-blocking, best-effort. addToIndex keeps the R2
    // explanation index current (used by bulk generation); no UI badge anymore.
    if (window.R2Explanations?.isConfigured()) {
      window.R2Explanations.save(item.questionImage, html).then(exp => {
        if (exp) {
          showRatingBar(exp, item.questionImage);
          window.R2Explanations.addToIndex(item.questionImage);
        }
      });
    }
  } catch (err) {
    const msg = err.message || 'Generation failed.';
    const looksLikeNetwork = /network error|load failed|failed to fetch/i.test(msg);
    if (backgroundedDuringFetch && looksLikeNetwork) {
      expEl.innerHTML = `<div class="pwa-ai-error"><strong>AI paused:</strong> iOS cancelled the request when you switched away from the app. Tap <strong>Explain with AI</strong> again and keep the app in foreground until the explanation loads (usually 10–20 seconds).</div>`;
      aiBtn.innerHTML = '&#10024; Explain with AI';
      // Auto-retry once on resume (only if the user is still viewing the same question)
      const currentQimg = item.questionImage;
      const onResume = () => {
        if (document.visibilityState !== 'visible') return;
        document.removeEventListener('visibilitychange', onResume);
        const stillItem = qbankFiltered[qbankIndex];
        if (stillItem && stillItem.questionImage === currentQimg && !getAiCache(currentQimg)) {
          handleAiExplain();
        }
      };
      document.addEventListener('visibilitychange', onResume);
    } else {
      expEl.innerHTML = `<div class="pwa-ai-error"><strong>AI error:</strong> ${esc(msg)}</div>`;
      aiBtn.innerHTML = '&#10024; Explain with AI';
    }
  } finally {
    document.removeEventListener('visibilitychange', onVis);
    aiBtn.disabled = false;
  }
}

/* ── Subject dropdown ───────────────────────────────────────────────────── */
function openSubjectDropdown() {
  document.getElementById('pwa-subject-dd').hidden = false;
  document.querySelector('#pwa-subject-btn .pwa-chevron').classList.add('pwa-chevron--open');
  document.getElementById('pwa-dd-backdrop').classList.add('visible');
  document.getElementById('pwa-subject-btn').setAttribute('aria-expanded', 'true');
}
function closeSubjectDropdown() {
  document.getElementById('pwa-subject-dd').hidden = true;
  document.getElementById('pwa-paper-dd').hidden = true;
  document.querySelector('#pwa-subject-btn .pwa-chevron').classList.remove('pwa-chevron--open');
  document.getElementById('pwa-dd-backdrop').classList.remove('visible');
  document.getElementById('pwa-subject-btn').setAttribute('aria-expanded', 'false');
}

/* Rebuild the subject dropdown items for the active stream's sections. */
function buildSubjectDropdown(sections) {
  const dd = document.getElementById('pwa-subject-dd');
  dd.innerHTML = [
    `<button class="pwa-dd-item active" data-subject="all">All Subjects</button>`,
    ...sections.map(s => `<button class="pwa-dd-item" data-subject="${esc(s.id)}">${esc(s.name)}</button>`),
    `<button class="pwa-dd-item pwa-dd-drill" data-role="paperwise">Paper-wise`
      + `<svg class="pwa-dd-arrow" viewBox="0 0 14 14" aria-hidden="true"><polyline points="5,3 10,7 5,11"/></svg></button>`,
  ].join('');
  qbankSubjectFilter = 'all';
  qbankPaperFilter   = 'all';
  document.getElementById('pwa-paper-dd').hidden = true;
  document.getElementById('pwa-subject-label').textContent = 'All Subjects';
}

/* Build the side flyout listing the active stream's papers (+ "All Papers"). */
function buildPaperFlyout() {
  const cur = qbankPaperFilter;
  const items = [
    `<button class="pwa-dd-item${cur === 'all' ? ' active' : ''}" data-exam-id="all">All Papers</button>`,
    ...papersForStream().map(p =>
      `<button class="pwa-dd-item${cur === p.examId ? ' active' : ''}" data-exam-id="${esc(p.examId)}">${esc(p.examTitle || p.examId)}</button>`),
  ];
  document.getElementById('pwa-paper-dd').innerHTML = items.join('');
}

/* Anchor the paper flyout beside the open subject panel: start it level with the
   "Paper-wise" row and extend down to ~90% of the viewport (10% gap at the bottom). */
function positionPaperFlyout() {
  const fly   = document.getElementById('pwa-paper-dd');
  const drill = document.querySelector('#pwa-subject-dd .pwa-dd-drill');
  const drillTop = drill ? drill.getBoundingClientRect().top : window.innerHeight * 0.4;
  const ABOVE = 24;   // start slightly above the drill row
  fly.style.top       = Math.max(8, drillTop - ABOVE) + 'px';
  fly.style.maxHeight = (window.innerHeight * 0.85 - (drillTop - ABOVE)) + 'px';
}

/* ── Stream selection ───────────────────────────────────────────────────── */
function updateStreamButton(cfg) {
  document.getElementById('pwa-stream-tag').textContent  = `${cfg.tet_label} · ${cfg.paper_label}`;
  document.getElementById('pwa-stream-name').textContent = cfg.label;
}

function saveFilters() {
  try {
    if (selectedBank)
      localStorage.setItem(filtersKey(selectedBank),
        JSON.stringify({ subject: qbankSubjectFilter, status: qbankStatusFilter, paper: qbankPaperFilter }));
  } catch {}
}

/* Switch the active stream: rebuild subjects, load that stream's index, render. */
async function selectStream(bank, { persist = true } = {}) {
  const cfg = findStream(bank) || findStream(DEFAULT_BANK) || allStreams()[0];
  if (!cfg) return;
  const prevBank = selectedBank;
  selectedBank   = cfg.tet_bank;
  selectedStream = cfg;
  streamSections = cfg.sections || [];
  if (persist) { try { localStorage.setItem(SELECTED_BANK_KEY, selectedBank); } catch {} }
  updateStreamButton(cfg);
  buildSubjectDropdown(streamSections);

  if (prevBank !== null && selectedBank !== prevBank) {
    // Explicit switch to a different stream: reset filters and position
    qbankSubjectFilter = 'all';
    qbankPaperFilter   = 'all';
    qbankStatusFilter  = 'to-read';
    _restorePos        = null;
  } else {
    // Initial load or same stream: restore saved filters + position
    try {
      const f = JSON.parse(localStorage.getItem(filtersKey(selectedBank)) || 'null');
      if (f) { qbankSubjectFilter = f.subject || 'all'; qbankStatusFilter = f.status || 'to-read'; qbankPaperFilter = f.paper || 'all'; }
    } catch {}
    try { _restorePos = localStorage.getItem(posKey(selectedBank)) || null; } catch {}
  }
  syncChipHighlight();
  qbankCache = null;
  await applyFilters();
}

/* ── Stream picker (TET → Paper → Stream) ───────────────────────────────── */
function openPicker() {
  populatePicker();
  document.getElementById('sp-close').hidden = !selectedBank;  // can't cancel before first pick
  document.getElementById('pwa-stream-picker').hidden = false;
}
function closePicker() { document.getElementById('pwa-stream-picker').hidden = true; }

/* Picker selection state (drives the custom dropdowns). */
let pickTet = null, pickPaper = null, pickBank = null;
function _spTet()   { const t = (qbManifest?.tets || []); return t.find(x => x.tet_type === pickTet) || t[0] || null; }
function _spPaper() { const p = _spTet()?.papers || []; return p.find(x => x.paper === pickPaper) || p[0] || null; }

function populatePicker() {
  const cur = selectedStream || findStream(DEFAULT_BANK) || allStreams()[0] || null;
  pickTet   = cur?.tet_type ?? qbManifest?.tets?.[0]?.tet_type ?? null;
  pickPaper = cur?.paper    ?? null;
  pickBank  = cur?.tet_bank ?? null;
  spRender();
  spCloseDD();
  document.getElementById('sp-version').textContent = APP_VERSION;

  // Overall scale across every stream — emphasised numbers, theme middot separators.
  const all    = allStreams();
  const papers = all.reduce((n, s) => n + (s.paper_count || 0), 0);
  const qs     = all.reduce((n, s) => n + (s.question_count || 0), 0);
  document.getElementById('sp-scale-text').innerHTML =
    `<strong>${papers.toLocaleString()}</strong> papers · ` +
    `<strong>${qs.toLocaleString()}</strong> questions across ` +
    `<strong>${all.length}</strong> streams`;
}

/* Render the three dropdown buttons + panels from the current picks, cascading
   TET → Paper → Stream and falling back to the first available at each level. */
function spRender() {
  const tets = qbManifest?.tets || [];
  if (!tets.some(t => t.tet_type === pickTet)) pickTet = tets[0]?.tet_type ?? null;
  const tet = _spTet();
  const papers = tet?.papers || [];
  if (!papers.some(p => p.paper === pickPaper)) pickPaper = papers[0]?.paper ?? null;
  const pap = _spPaper();
  const streams = pap?.streams || [];
  if (!streams.some(s => s.tet_bank === pickBank)) pickBank = streams[0]?.tet_bank ?? null;

  document.getElementById('sp-tet-val').textContent = tet?.label || '—';
  document.getElementById('sp-tet-dd').innerHTML = tets.map(t =>
    `<button class="sp-dd-opt${t.tet_type === pickTet ? ' active' : ''}" data-tet="${esc(t.tet_type)}">${esc(t.label)}</button>`).join('');

  document.getElementById('sp-paper-val').textContent = pap?.label || '—';
  document.getElementById('sp-paper-dd').innerHTML = papers.map(p =>
    `<button class="sp-dd-opt${p.paper === pickPaper ? ' active' : ''}" data-paper="${esc(p.paper)}">${esc(p.label)}</button>`).join('');

  const curStream = streams.find(s => s.tet_bank === pickBank);
  document.getElementById('sp-stream-val').textContent = curStream?.label || '—';
  document.getElementById('sp-stream-dd').innerHTML = streams.map(s => {
    const meta = `${s.paper_count} paper${s.paper_count === 1 ? '' : 's'}`;
    return `<button class="sp-dd-opt sp-dd-opt--stream${s.tet_bank === pickBank ? ' active' : ''}" data-bank="${esc(s.tet_bank)}">`
      + `<span class="sp-dd-opt-name">${esc(s.label)}</span><span class="sp-dd-opt-meta">${esc(meta)}</span></button>`;
  }).join('');

  updatePickerSummary();
}

function updatePickerSummary() {
  const s = findStream(pickBank);
  const el = document.getElementById('sp-summary');
  const confirm = document.getElementById('sp-confirm');
  if (!s) { el.innerHTML = '<span class="sp-empty">No question banks available.</span>'; confirm.disabled = true; return; }
  confirm.disabled = false;
  el.innerHTML = `<strong>${s.paper_count}</strong> paper${s.paper_count === 1 ? '' : 's'} · ` +
                 `<strong>${s.question_count.toLocaleString()}</strong> questions` +
                 `<br>${esc(s.sections.map(x => x.name).join(' · '))}`;
}

/* Picker dropdown open/close — only one panel open at a time. */
function spCloseDD(except) {
  ['sp-tet', 'sp-paper', 'sp-stream'].forEach(id => {
    if (id === except) return;
    document.getElementById(id + '-dd').hidden = true;
    document.getElementById(id + '-btn').setAttribute('aria-expanded', 'false');
  });
}
function positionDD(id) {
  if (id === 'sp-stream') return;   // stream uses fixed CSS insets, not button-anchored
  const dd = document.getElementById(id + '-dd');
  const br = document.getElementById(id + '-btn').getBoundingClientRect();
  dd.style.top = ''; dd.style.bottom = '';
  dd.style.top = (br.bottom + 6) + 'px';
}
function spToggleDD(id) {
  const dd = document.getElementById(id + '-dd');
  const open = dd.hidden;            // hidden now → about to open
  spCloseDD(open ? id : null);
  dd.hidden = !open;
  document.getElementById(id + '-btn').setAttribute('aria-expanded', String(open));
  if (open) positionDD(id);
}

/* Initial load: manifest → pre-fill picker from last selection → always open picker.
   QB index is deferred until the user confirms. */
async function initStreams() {
  try { await loadManifest(); }
  catch (e) {
    document.getElementById('pwa-explanation').innerHTML =
      `<p class="pwa-msg">Could not load question banks: ${esc(e.message)}</p>`;
    return;
  }
  let saved = null;
  try { saved = localStorage.getItem(SELECTED_BANK_KEY); } catch {}
  const target = (saved && findStream(saved)) ? saved : DEFAULT_BANK;
  // If the user has a saved position, resume directly — skip the picker.
  let savedPos = null;
  try { if (saved) savedPos = localStorage.getItem(posKey(target)); } catch {}
  if (saved && savedPos) {
    await selectStream(target, { persist: false });
  } else {
    // No saved position: always show picker (pre-filled with last selection).
    const cfg = findStream(target);
    if (cfg) {
      selectedBank   = cfg.tet_bank;
      selectedStream = cfg;
      streamSections = cfg.sections || [];
      updateStreamButton(cfg);
    }
    openPicker();
    document.getElementById('sp-close').hidden = !saved;
  }
}

/* ── Chip highlight sync ────────────────────────────────────────────────── */
function syncChipHighlight() {
  document.querySelectorAll('#pwa-chips-scroll .pwa-chip').forEach(b =>
    b.classList.toggle('active', b.dataset.status === qbankStatusFilter));
}

/* ── Bootstrap ──────────────────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {

  // On special pushes, increment CACHE_BUST to wipe stale localStorage keys.
  // User progress (understood / revision) is intentionally preserved.
  const BUST_LS_KEY = 'cache_bust_v';
  if (localStorage.getItem(BUST_LS_KEY) !== CACHE_BUST) {
    Object.keys(localStorage)
      .filter(k => k.startsWith('qb_index_cache_') || k === MANIFEST_CACHE_KEY ||
                   k.startsWith(AI_CACHE_PFX) || k.startsWith('r2_exp:'))
      .forEach(k => localStorage.removeItem(k));
    localStorage.setItem(BUST_LS_KEY, CACHE_BUST);
  }

  cleanConflictingStates();

  document.getElementById('pwa-explanation').innerHTML =
    '<span class="pwa-msg">Loading question bank…</span>';
  initStreams();

  /* Stream switcher → open picker */
  document.getElementById('pwa-stream-btn').addEventListener('click', openPicker);

  /* Picker custom dropdowns + actions */
  document.getElementById('sp-tet-btn').addEventListener('click', e => { e.stopPropagation(); spToggleDD('sp-tet'); });
  document.getElementById('sp-paper-btn').addEventListener('click', e => { e.stopPropagation(); spToggleDD('sp-paper'); });
  document.getElementById('sp-stream-btn').addEventListener('click', e => { e.stopPropagation(); spToggleDD('sp-stream'); });
  document.getElementById('sp-tet-dd').addEventListener('click', e => {
    const b = e.target.closest('.sp-dd-opt'); if (!b) return;
    pickTet = b.dataset.tet; pickPaper = null; pickBank = null; spRender(); spCloseDD();
  });
  document.getElementById('sp-paper-dd').addEventListener('click', e => {
    const b = e.target.closest('.sp-dd-opt'); if (!b) return;
    pickPaper = b.dataset.paper; pickBank = null; spRender(); spCloseDD();
  });
  document.getElementById('sp-stream-dd').addEventListener('click', e => {
    const b = e.target.closest('.sp-dd-opt'); if (!b) return;
    pickBank = b.dataset.bank; spRender(); spCloseDD();
  });
  // Tapping anywhere in the picker card outside a field closes any open dropdown.
  document.getElementById('pwa-stream-picker').addEventListener('click', e => {
    if (!e.target.closest('.sp-field')) spCloseDD();
  });
  document.getElementById('sp-confirm').addEventListener('click', () => {
    const bank = pickBank || selectedBank;
    closePicker();
    selectStream(bank);   // always load — may be first open or a new selection
  });
  document.getElementById('sp-close').addEventListener('click', () => {
    closePicker();
    // If QB index wasn't loaded yet (returning user dismissed without changing), load now
    if (!qbankCache) selectStream(selectedBank);
  });

  /* Subject dropdown toggle */
  document.getElementById('pwa-subject-btn').addEventListener('click', e => {
    e.stopPropagation();
    document.getElementById('pwa-subject-dd').hidden ? openSubjectDropdown() : closeSubjectDropdown();
  });
  document.getElementById('pwa-dd-backdrop').addEventListener('click', closeSubjectDropdown);

  /* Subject selection + "Paper-wise" drill */
  document.getElementById('pwa-subject-dd').addEventListener('click', e => {
    const drill = e.target.closest('.pwa-dd-drill');
    if (drill) {
      const fly = document.getElementById('pwa-paper-dd');
      if (fly.hidden) { buildPaperFlyout(); fly.hidden = false; positionPaperFlyout(); }
      else fly.hidden = true;
      return;
    }
    const btn = e.target.closest('.pwa-dd-item');
    if (!btn || btn.dataset.subject == null) return;
    const newSubject = btn.dataset.subject;
    qbankSubjectFilter = newSubject;
    qbankPaperFilter   = 'all';
    document.getElementById('pwa-subject-label').textContent = subjectDisplay(newSubject);
    document.querySelectorAll('#pwa-subject-dd .pwa-dd-item').forEach(b =>
      b.classList.toggle('active', b.dataset.subject === newSubject));
    closeSubjectDropdown();
    saveFilters(); applyFilters();
  });

  /* Paper-wise selection (mutually exclusive with subject) */
  document.getElementById('pwa-paper-dd').addEventListener('click', e => {
    const btn = e.target.closest('.pwa-dd-item');
    if (!btn) return;
    const id = btn.dataset.examId;
    qbankPaperFilter   = id;          // 'all' or an examId
    qbankSubjectFilter = 'all';
    let label = 'All Subjects';
    if (id !== 'all') { const p = papersForStream().find(x => x.examId === id); label = p ? (p.examTitle || id) : 'Paper'; }
    document.getElementById('pwa-subject-label').textContent = label;
    // Active marker: drill row when a paper is active, else "All Subjects".
    document.querySelectorAll('#pwa-subject-dd .pwa-dd-item').forEach(b => {
      const onAll   = id === 'all' && b.dataset.subject === 'all';
      const onDrill = id !== 'all' && b.classList.contains('pwa-dd-drill');
      b.classList.toggle('active', onAll || onDrill);
    });
    closeSubjectDropdown();
    saveFilters(); applyFilters();
  });

  /* Status chips */
  document.getElementById('pwa-chips-scroll').addEventListener('click', e => {
    const chip = e.target.closest('.pwa-chip');
    if (!chip) return;
    qbankStatusFilter = chip.dataset.status;
    syncChipHighlight();
    saveFilters(); applyFilters();
  });

  /* Nav buttons — history-aware back / forward / random (logic in navPrev/navNext) */
  document.getElementById('pwa-prev').addEventListener('click', () => navAnimated('prev'));
  document.getElementById('pwa-next').addEventListener('click', () => navAnimated('next'));
  document.getElementById('pwa-random').addEventListener('click', () => {
    if (qbankFiltered.length > 0) {
      navPush(Math.floor(Math.random() * qbankFiltered.length));
      renderCurrent();
    }
  });

  /* Focus mode toggle + swipe-to-navigate (active everywhere; sole nav in focus mode) */
  document.getElementById('pwa-fab-focus').addEventListener('click', () => setFocusMode(!isFocusMode()));
  attachSwipe(document.getElementById('pwa-qcard'));

  /* Option click — reveal correct/wrong on first tap */
  document.getElementById('pwa-opts').addEventListener('click', e => {
    const optEl = e.target.closest('.pwa-opt');
    if (!optEl) return;
    const picked = Number(optEl.dataset.opt);
    if (!picked) return;
    revealOption(picked);
  });

  /* FAB: revision bookmark (available in To Read / Explained) */
  document.getElementById('pwa-fab-revision').addEventListener('click', () => {
    const item = qbankFiltered[qbankIndex];
    if (!item) return;
    toggleRevision(item.questionImage);
    updateFabState();
    updateHeaderProgress();
    const inReview = getRevisionSet().has(item.questionImage);
    showToast(inReview ? '🔖 Added to In Review' : '🔖 Removed from In Review');
  });

  /* FAB: understood — behaviour differs by active filter */
  document.getElementById('pwa-fab-understood').addEventListener('click', () => {
    const item = qbankFiltered[qbankIndex];
    if (!item) return;
    const qimg = item.questionImage;

    if (qbankStatusFilter === 'in-review') {
      // Mark understood + remove from revision list. Drop the question from the
      // current filtered view (it no longer matches In Review), keeping qbankIndex
      // pointed at the next question in the list.
      const s = getUnderstoodSet(); s.add(qimg); saveUnderstoodSet(s);
      saveRevisionList(getRevisionList().filter(r => r.q?.questionImage !== qimg));
      qbankFiltered.splice(qbankIndex, 1);
      showToast('✓ Understood — moved out of In Review');
      renderCurrent();
    } else if (qbankStatusFilter === 'understood') {
      // Toggle off (unmark) — drop from current filtered view.
      const s = getUnderstoodSet();
      if (s.has(qimg)) {
        s.delete(qimg); saveUnderstoodSet(s);
        qbankFiltered.splice(qbankIndex, 1);
        showToast('↩ Removed from Understood');
        renderCurrent();
      }
    } else {
      // To Read / Explained: simple toggle. Keep the question in the visible
      // list so Next still goes to the immediately-following question
      // instead of skipping the one just removed.
      toggleUnderstood(qimg);
      updateFabState();
      updateHeaderProgress();
      const isNow = getUnderstoodSet().has(qimg);
      showToast(isNow ? '✓ Marked as Understood' : '↩ Removed from Understood');
    }
  });

  document.getElementById('pwa-ai-btn').addEventListener('click', handleAiExplain);
  document.getElementById('pwa-fab-like').addEventListener('click', handleRate);

  /* Font-size knob */
  const knobSlider = document.getElementById('font-knob-slider');
  const knobVal    = document.getElementById('font-knob-val');
  knobSlider.value = targetLineHeightPx;
  knobVal.textContent = targetLineHeightPx;
  knobSlider.addEventListener('input', () => {
    targetLineHeightPx = parseInt(knobSlider.value, 10);
    knobVal.textContent = targetLineHeightPx;
    localStorage.setItem(LS_FONT_SIZE_KEY, targetLineHeightPx);
    applyScaleToCurrentQuestion();
  });


  /* iOS zoom prevention */
  document.addEventListener('gesturestart', e => e.preventDefault());
  let _lastTap = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - _lastTap < 350) e.preventDefault();
    _lastTap = now;
  }, { passive: false });

  // Update banner handlers
  document.getElementById('pwa-update-reload').addEventListener('click', () => window.location.reload());
  document.getElementById('pwa-update-dismiss').addEventListener('click', () => {
    document.getElementById('pwa-update-banner').setAttribute('hidden', '');
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./qb_pwa_sw.js', { scope: './' })
      .then(async reg => {
        // Auto-reload when a new SW takes control — position + filters are persisted so resume is seamless
        let prevController = navigator.serviceWorker.controller;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (prevController !== null) window.location.reload();
          prevController = navigator.serviceWorker.controller;
        });

        // Listen for SW postMessage: new qb_index.json content detected during background revalidation
        navigator.serviceWorker.addEventListener('message', e => {
          if (e.data?.type === 'QB_INDEX_UPDATED') {
            document.getElementById('pwa-update-banner').removeAttribute('hidden');
          }
        });

        // Background Sync: re-validate qb_index.json whenever connectivity resumes
        if ('sync' in reg) {
          window.addEventListener('online', () => {
            reg.sync.register('qb-index-sync').catch(() => {});
          });
        }

        // Periodic Background Sync: daily refresh on Android Chrome.
        // iOS PWA does not support periodicSync; the online-event sync above covers that gap.
        if ('periodicSync' in reg) {
          try {
            const perm = await navigator.permissions.query({ name: 'periodic-background-sync' });
            if (perm.state === 'granted') {
              await reg.periodicSync.register('qb-index-daily', { minInterval: 24 * 60 * 60 * 1000 });
            }
          } catch {}
        }
      })
      .catch(err => console.warn('[QB PWA] SW registration failed:', err));
  }

  // Recover from broken state after iOS bfcache restore or PWA resume.
  // If the page was frozen mid-initialization (applyFilters still in-flight when
  // iOS backgrounded it), the DOM shows the initial shell with no data. Detect
  // this on any visible-transition and re-run initialization.
  function _resumeCheck() {
    if (!qbManifest || !selectedBank) { initStreams(); }
    else if (!qbankCache || !qbankFiltered.length) applyFilters();
  }
  // pageshow with persisted=true: bfcache restore (typical iOS minimize+reopen)
  window.addEventListener('pageshow', e => { if (e.persisted) _resumeCheck(); });
  // visibilitychange: covers lock-screen unlock, app-switcher resume, and edge cases
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') _resumeCheck();
  });
});
</script>
